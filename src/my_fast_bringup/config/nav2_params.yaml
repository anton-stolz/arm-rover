amcl:
  ros__parameters:
    alpha1: 0.12
    alpha2: 0.08
    alpha3: 0.08
    alpha4: 0.12
    alpha5: 0.08
    base_frame_id: base_link
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 1.5
    laser_max_range: 12.0
    laser_min_range: 0.15
    laser_model_type: likelihood_field
    max_beams: 360
    max_particles: 5000
    min_particles: 2000
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.1
    recovery_alpha_slow: 0.001
    resample_interval: 2
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    scan_topic: scan
    sigma_hit: 0.08
    tf_broadcast: true
    transform_tolerance: 1.0
    set_initial_pose: true
    initial_pose_x: 5.844
    initial_pose_y: 3.704
    initial_pose_yaw: -1.882
    update_min_a: 0.08
    update_min_d: 0.08
    z_hit: 0.80
    z_max: 0.02
    z_rand: 0.15
    z_short: 0.03
behavior_server:
  ros__parameters:
    assisted_teleop:
      plugin: nav2_behaviors::AssistedTeleop
    backup:
      plugin: nav2_behaviors::BackUp
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - assisted_teleop
    - wait
    cycle_frequency: 5.0
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    global_frame: map
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    local_frame: odom
    max_rotational_vel: 1.0
    min_rotational_vel: 1.0
    robot_base_frame: base_link
    rotational_acc_lim: 10.0
    simulate_ahead_time: 2.0
    spin:
      plugin: nav2_behaviors::Spin
    transform_tolerance: 0.75
    wait:
      plugin: nav2_behaviors::Wait
bt_navigator:
  ros__parameters:
    default_nav_to_pose_bt_xml: /home/anton/ros2_ws/src/my_fast_bringup/config/fast_recovery.xml
    action_server_result_timeout: 900.0
    bt_loop_duration: 10
    default_server_timeout: 4000
    error_code_names:
    - compute_path_error_code
    - follow_path_error_code
    global_frame: map
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigators:
    - navigate_to_pose
    - navigate_through_poses
    odom_topic: /odom
    robot_base_frame: base_link
    wait_for_service_timeout: 4000
collision_monitor:
  ros__parameters:
    PolygonStop:
      action_type: stop
      enabled: true
      min_points: 3
      points: '[[0.18, 0.18], [0.18, -0.18], [-0.18, -0.18], [-0.18, 0.18]]'
      polygon_pub_topic: polygon_stop
      type: polygon
      visualize: false
    base_frame_id: base_link
    base_shift_correction: true
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    observation_sources:
    - scan
    odom_frame_id: odom
    polygons:
    - PolygonStop
    scan:
      enabled: true
      max_height: 2.0
      min_height: 0.15
      topic: scan
      type: scan
    source_timeout: 1.0
    state_topic: collision_monitor_state
    stop_pub_timeout: 2.0
    transform_tolerance: 0.75
controller_server:
  ros__parameters:
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.24
      lookahead_dist: 0.55
      min_lookahead_dist: 0.30
      max_lookahead_dist: 0.55
      lookahead_time: 1.2
      rotate_to_heading_angular_vel: 1.0
      transform_tolerance: 0.75
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_vel: 0.24
      min_approach_linear_velocity: 0.24
      approach_velocity_scaling_dist: 0.15
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_fast_stop: 1.0
      use_regulated_linear_velocity_scaling: false
      use_cost_regulated_linear_velocity_scaling: false
      cost_scaling_dist: 0.25
      cost_scaling_gain: 1.0
      regulated_linear_scaling_min_radius: 0.4
      regulated_linear_scaling_min_speed: 0.24
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.70
      max_angular_accel: 10.0
      allow_reversing: false
    controller_frequency: 10.0
    controller_plugins:
    - FollowPath
    costmap_update_timeout: 0.3
    failure_tolerance: 1.5
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.45
    goal_checker_plugins:
    - general_goal_checker
    current_goal_checker: general_goal_checker
    current_progress_checker: progress_checker
    min_theta_velocity_threshold: 0.001
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    progress_checker:
      movement_time_allowance: 15.0
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
    progress_checker_plugins:
    - progress_checker
    use_realtime_priority: false
docking_server:
  ros__parameters:
    base_frame: base_link
    controller_frequency: 50.0
    dock_approach_timeout: 1000.0
    dock_plugins:
    - simple_charging_dock
    initial_perception_timeout: 5.0
    max_retries: 3
    odom_frame: odom
    simple_charging_dock:
      docking_threshold: 0.05
      plugin: opennav_docking::SimpleChargingDock
      staging_x_offset: -0.5
      staging_yaw_offset: 0.0
      use_battery_status: false
      use_external_detection_pose: true
    undock_angular_tolerance: 0.1
    undock_linear_tolerance: 0.05
    wait_charge_timeout: 5.0
global_costmap:
  global_costmap:
    ros__parameters:
      always_send_full_costmap: true
      global_frame: map
      inflation_layer:
        cost_scaling_factor: 8.0
        inflation_radius: 0.22
        plugin: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        enabled: true
        observation_sources: scan bumper
        plugin: nav2_costmap_2d::ObstacleLayer
        scan:
          clearing: true
          data_type: LaserScan
          marking: true
          max_obstacle_height: 2.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          topic: /scan
        bumper:
          clearing: false
          data_type: PointCloud2
          marking: true
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
          raytrace_max_range: 0.0
          raytrace_min_range: 0.0
          topic: /bumper_obstacles
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      publish_frequency: 1.0
      resolution: 0.05
      robot_base_frame: base_link
      footprint: '[[0.15, 0.15], [0.15, -0.15], [-0.15, -0.15], [-0.15, 0.15]]'
      static_layer:
        map_subscribe_transient_local: false
        plugin: nav2_costmap_2d::StaticLayer
      track_unknown_space: true
      update_frequency: 1.0
local_costmap:
  local_costmap:
    ros__parameters:
      always_send_full_costmap: true
      global_frame: odom
      height: 3
      inflation_layer:
        cost_scaling_factor: 8.0
        inflation_radius: 0.22
        plugin: nav2_costmap_2d::InflationLayer
      plugins:
      - obstacle_layer
      - inflation_layer
      publish_frequency: 2.0
      resolution: 0.05
      robot_base_frame: base_link
      footprint: '[[0.15, 0.15], [0.15, -0.15], [-0.15, -0.15], [-0.15, 0.15]]'
      rolling_window: true
      static_layer:
        map_subscribe_transient_local: false
        plugin: nav2_costmap_2d::StaticLayer
      update_frequency: 5.0
      obstacle_layer:
        enabled: true
        mark_threshold: 0
        max_obstacle_height: 2.0
        observation_sources: scan bumper
        origin_z: 0.0
        plugin: nav2_costmap_2d::ObstacleLayer
        publish_voxel_map: true
        scan:
          clearing: true
          data_type: LaserScan
          marking: true
          max_obstacle_height: 2.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          topic: /scan
        bumper:
          clearing: false
          data_type: PointCloud2
          marking: true
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
          raytrace_max_range: 0.0
          raytrace_min_range: 0.0
          topic: /bumper_obstacles
        z_resolution: 0.05
        z_voxels: 16
      width: 3
map_saver:
  ros__parameters:
    free_thresh_default: 0.25
    map_subscribe_transient_local: false
    occupied_thresh_default: 0.65
    save_map_timeout: 5.0
planner_server:
  ros__parameters:
    GridBased:
      allow_unknown: true
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.75
      use_astar: true
    costmap_update_timeout: 1.0
    expected_planner_frequency: 1.0
    planner_plugins:
    - GridBased
route_server:
  ros__parameters:
    AdjustSpeedLimit:
      plugin: nav2_route::AdjustSpeedLimit
    CollisionMonitor:
      max_collision_dist: 3.0
      plugin: nav2_route::CollisionMonitor
    CostmapScorer:
      plugin: nav2_route::CostmapScorer
    DistanceScorer:
      plugin: nav2_route::DistanceScorer
    ReroutingService:
      plugin: nav2_route::ReroutingService
    boundary_radius_to_achieve_node: 1.0
    edge_cost_functions:
    - DistanceScorer
    - CostmapScorer
    operations:
    - AdjustSpeedLimit
    - ReroutingService
    - CollisionMonitor
    radius_to_achieve_node: 2.0
    smooth_corners: true
smoother_server:
  ros__parameters:
    simple_smoother:
      do_refinement: true
      max_its: 1000
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
    smoother_plugins:
    - simple_smoother
velocity_smoother:
  ros__parameters:
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    feedback: OPEN_LOOP
    max_accel:
    - 1.5
    - 0.0
    - 10.0
    max_decel:
    - -1.5
    - 0.0
    - -10.0
    max_velocity:
    - 0.28
    - 0.0
    - 1.0
    min_velocity:
    - -0.25
    - 0.0
    - -1.0
    odom_duration: 0.1
    odom_topic: odometry/filtered
    scale_velocities: true
    smoothing_frequency: 10.0
    stamp_smoothed_velocity_with_smoothing_time: false
    velocity_timeout: 1.0
waypoint_follower:
  ros__parameters:
    action_server_result_timeout: 900.0
    loop_rate: 10
    stop_on_failure: false
    wait_at_waypoint:
      enabled: true
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      waypoint_pause_duration: 200
    waypoint_task_executor_plugin: wait_at_waypoint

map_server:
  ros__parameters:
    use_sim_time: false
    
